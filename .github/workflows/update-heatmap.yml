name: Update profile heatmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/fetch_contributions.py "${{ github.repository_owner }}"

      - run: python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
          # Commit as the Actions bot so these automated commits don't count
          # as your own contributions (otherwise every day shows activity).
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898299+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898299+github-actions[bot]@users.noreply.github.com>"
